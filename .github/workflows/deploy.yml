name: Build & Deploy to games.alphazone.com.au

on:
  push:
    branches: [master]
    paths-ignore:
      - 'dist/**'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: deploy-games-alphazone
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Write .env
        run: |
          cat > .env << EOF
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL=${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          EOF

      - run: npm ci
      - run: npm run build

      # The relay is PERMANENT now (2026-08-26). It used to be uploaded via
      # the cPanel API before every run and neutralised after — then the host
      # put an anti-bot wall in front of the cPanel API origin and both calls
      # started failing (challenge page, then 401s) while the site domain
      # stayed clean. The relay lives at the docroot permanently, keyed by the
      # GAMES_RELAY_KEY secret (48 hex chars, not the old literal), placed by
      # hand via File Manager. Rotate by editing the file + the secret.
      - name: Check relay
        run: |
          RESP=$(curl -sf "https://games.alphazone.com.au/_deploy-relay.php")
          if [ "$RESP" != "relay-ok" ]; then
            echo "::error::permanent relay not answering (got: $RESP) — re-place _deploy-relay.php via File Manager"
            exit 1
          fi

      # Upload every file under dist/assets/ (JS/CSS bundles) in one POST each
      # — chunked appends previously corrupted a bundle when two deploy runs
      # overlapped, so this uploads whole-file and verifies the byte count
      # the server reports back matches the local file exactly.
      - name: Upload assets
        run: |
          for f in dist/assets/*; do
            NAME=$(basename "$f")
            LOCAL_SIZE=$(wc -c < "$f")
            base64 -w 0 "$f" > /tmp/enc.txt
            RESP=$(curl -sf "https://games.alphazone.com.au/_deploy-relay.php" \
              -d "key=${{ secrets.GAMES_RELAY_KEY }}&name=${NAME}&target=assets&mode=w" \
              --data-urlencode "data@/tmp/enc.txt")
            echo "$NAME: $RESP (local: $LOCAL_SIZE bytes)"
            REMOTE_SIZE=$(echo "$RESP" | sed -n 's/^ok:\([0-9]*\)$/\1/p')
            if [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
              echo "::error::$NAME upload size mismatch (local $LOCAL_SIZE, remote $REMOTE_SIZE)"
              exit 1
            fi
          done

      # Upload index.html
      - name: Upload index.html
        run: |
          LOCAL_SIZE=$(wc -c < dist/index.html)
          base64 -w 0 dist/index.html > /tmp/htmlb64.txt
          RESP=$(curl -sf "https://games.alphazone.com.au/_deploy-relay.php" \
            -d "key=${{ secrets.GAMES_RELAY_KEY }}&name=index.html&target=root&mode=w" \
            --data-urlencode "data@/tmp/htmlb64.txt")
          echo "index.html: $RESP (local: $LOCAL_SIZE bytes)"
          REMOTE_SIZE=$(echo "$RESP" | sed -n 's/^ok:\([0-9]*\)$/\1/p')
          if [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
            echo "::error::index.html upload size mismatch (local $LOCAL_SIZE, remote $REMOTE_SIZE)"
            exit 1
          fi

      # ---------------------------------------------------------------- #
      # THE GAME, vendored from the private alphazone2026/burgerbarn repo and
      # served at /burgerbarn/. It is called GREEN HOLLOW on the home page
      # now (2026-09-06) and the folder deliberately did not follow the name:
      # Ben, "Burgerbarn can stay same folder name, just change text". The
      # original Green Hollow's own upload step used to sit ABOVE this one and
      # left with its build in the same commit.
      # To refresh the vendored copy (macOS — the PowerShell note this comment
      # used to carry was for the old PC; MSYS2 is not in the way here):
      #   cd burgerbarn && BARN_BASE=/burgerbarn/ node node_modules/vite/bin/vite.js build
      #   rm -rf ../games-alphazone/public/burgerbarn
      #   cp -r dist ../games-alphazone/public/burgerbarn
      # ---------------------------------------------------------------- #
      - name: Upload Burger Barn
        run: |
          if [ ! -f dist/burgerbarn/index.html ]; then
            echo "::error::dist/burgerbarn/index.html missing — is public/burgerbarn/ committed?"
            exit 1
          fi
          upload() {
            FILE="$1"; NAME="$2"; TARGET="$3"
            LOCAL_SIZE=$(wc -c < "$FILE")
            base64 -w 0 "$FILE" > /tmp/bb_enc.txt
            RESP=$(curl -sf "https://games.alphazone.com.au/_deploy-relay.php" \
              -d "key=${{ secrets.GAMES_RELAY_KEY }}&name=${NAME}&target=${TARGET}&mode=w" \
              --data-urlencode "data@/tmp/bb_enc.txt")
            echo "  ${TARGET}/${NAME}: $RESP (local: $LOCAL_SIZE bytes)"
            REMOTE_SIZE=$(echo "$RESP" | sed -n 's/^ok:\([0-9]*\)$/\1/p')
            if [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
              echo "::error::${NAME} upload size mismatch (local $LOCAL_SIZE, remote $REMOTE_SIZE)"
              exit 1
            fi
          }
          for f in dist/burgerbarn/assets/*; do
            upload "$f" "$(basename "$f")" "burgerbarn/assets"
          done
          upload dist/burgerbarn/index.html index.html burgerbarn
          # THE CACHE HEADERS (2026-09-10). Ben played two deploys behind after
          # a hard refresh, because the host sends no Cache-Control on
          # index.html and browsers then cache it HEURISTICALLY — a stale map
          # to stale bundle hashes. The .htaccess marks html no-cache and the
          # content-hashed assets immutable. It is uploaded BY NAME like every
          # other file: this step never walked the folder, which is exactly why
          # a new file in public/ has to be listed here as well.
          upload dist/burgerbarn/.htaccess .htaccess burgerbarn

      # ---------------------------------------------------------------- #
      # THE SECOND 3D GAME, served at /console-room/. Built from
      # ClaudeSessions/doctorwho and vendored into public/console-room, exactly
      # as Burger Barn is — the games site never builds these, it carries them.
      #
      # THE FOLDER AND THE NAME DIFFER ON PURPOSE, the same way Green Hollow
      # lives at /burgerbarn/ (Ben, 2026-09-11: call it the Doctor Who game on
      # the card). A neutral path means the display name can change on the home
      # page in one line without a rebuild, a re-vendor and a dead URL.
      #
      # To refresh the vendored copy (macOS):
      #   cd doctorwho && DW_BASE=/console-room/ node node_modules/vite/bin/vite.js build
      #   rm -rf ../games-alphazone/public/console-room
      #   cp -r dist ../games-alphazone/public/console-room
      #
      # THE HAND STEP IS GONE AS OF 2026-09-12. For four deploys this recipe
      # ended "now re-add public/console-room/.htaccess, because cp -r of dist
      # will not carry it" — a step nothing visibly fails without, since the
      # site simply goes on serving yesterday's build and every check against
      # it passes. The file is now tracked at doctorwho/public/.htaccess, so
      # Vite copies it into dist and cp -r brings it across. That is what
      # longstep already did and the reason that game was never the one that bit.
      #
      # THIS STEP LISTS ITS FILES BY NAME and does not walk the folder, which
      # is the same trap the Burger Barn step carries: a NEW file in
      # public/console-room/ has to be added here too or it silently never
      # ships.
      # ---------------------------------------------------------------- #
      - name: Upload the console room
        run: |
          if [ ! -f dist/console-room/index.html ]; then
            echo "::error::dist/console-room/index.html missing — is public/console-room/ committed?"
            exit 1
          fi
          upload() {
            FILE="$1"; NAME="$2"; TARGET="$3"
            LOCAL_SIZE=$(wc -c < "$FILE")
            base64 -w 0 "$FILE" > /tmp/cr_enc.txt
            RESP=$(curl -sf "https://games.alphazone.com.au/_deploy-relay.php" \
              -d "key=${{ secrets.GAMES_RELAY_KEY }}&name=${NAME}&target=${TARGET}&mode=w" \
              --data-urlencode "data@/tmp/cr_enc.txt")
            echo "  ${TARGET}/${NAME}: $RESP (local: $LOCAL_SIZE bytes)"
            REMOTE_SIZE=$(echo "$RESP" | sed -n 's/^ok:\([0-9]*\)$/\1/p')
            if [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
              echo "::error::${NAME} upload size mismatch (local $LOCAL_SIZE, remote $REMOTE_SIZE)"
              exit 1
            fi
          }
          for f in dist/console-room/assets/*; do
            upload "$f" "$(basename "$f")" "console-room/assets"
          done
          upload dist/console-room/index.html index.html console-room
          upload dist/console-room/.htaccess .htaccess console-room

      # ---------------------------------------------------------------- #
      # THE THIRD 3D GAME, served at /gateroom/. Built from
      # ClaudeSessions/longstep and vendored into public/gateroom, exactly as
      # the other two are — the games site never builds these, it carries them.
      #
      # THE FOLDER AND THE NAME DIFFER ON PURPOSE, a third time. It is called
      # STARGATE on the home page (Ben, 2026-09-11) and the marks belong to MGM,
      # so the PATH says what the place is rather than what the show is called:
      # this game will always be about a gate room, and it may not always carry
      # that name. A live URL is the one thing you cannot change cheaply.
      #
      # To refresh the vendored copy (macOS):
      #   cd longstep && LS_BASE=/gateroom/ node node_modules/vite/bin/vite.js build
      #   rm -rf ../games-alphazone/public/gateroom
      #   cp -r dist ../games-alphazone/public/gateroom
      #
      # UNLIKE THE CONSOLE ROOM, THE .htaccess NEEDS NO HAND STEP. It is tracked
      # at longstep/public/.htaccess, so Vite copies it into dist and `cp -r`
      # carries it across — Green Hollow's arrangement, and the reason that one
      # has never been the file that bit. It is still uploaded BY NAME below,
      # because this step lists its files and walks no folder: a NEW file under
      # public/gateroom/ has to be added here or it silently never ships, and
      # every local check still passes.
      # ---------------------------------------------------------------- #
      - name: Upload the gate room
        run: |
          if [ ! -f dist/gateroom/index.html ]; then
            echo "::error::dist/gateroom/index.html missing — is public/gateroom/ committed?"
            exit 1
          fi
          if [ ! -f dist/gateroom/.htaccess ]; then
            echo "::error::dist/gateroom/.htaccess missing — it should ride out of longstep/public/"
            exit 1
          fi
          upload() {
            FILE="$1"; NAME="$2"; TARGET="$3"
            LOCAL_SIZE=$(wc -c < "$FILE")
            base64 -w 0 "$FILE" > /tmp/gr_enc.txt
            RESP=$(curl -sf "https://games.alphazone.com.au/_deploy-relay.php" \
              -d "key=${{ secrets.GAMES_RELAY_KEY }}&name=${NAME}&target=${TARGET}&mode=w" \
              --data-urlencode "data@/tmp/gr_enc.txt")
            echo "  ${TARGET}/${NAME}: $RESP (local: $LOCAL_SIZE bytes)"
            REMOTE_SIZE=$(echo "$RESP" | sed -n 's/^ok:\([0-9]*\)$/\1/p')
            if [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
              echo "::error::${NAME} upload size mismatch (local $LOCAL_SIZE, remote $REMOTE_SIZE)"
              exit 1
            fi
          }
          for f in dist/gateroom/assets/*; do
            upload "$f" "$(basename "$f")" "gateroom/assets"
          done
          upload dist/gateroom/index.html index.html gateroom
          upload dist/gateroom/.htaccess .htaccess gateroom

      # ---------------------------------------------------------------- #
      # THE FOURTH 3D GAME, served at /range/. Built from
      # ClaudeSessions/games/games/predestiny and vendored into public/range,
      # exactly as the other three are — the games site never builds these,
      # it carries them.
      #
      # THE PATH IS NEUTRAL AND THE NAME IS NOT, a fourth time, same reason:
      # a live path is the one thing you cannot change cheaply. This is a
      # gray-box gunplay test range only so far — not the actual game's
      # content, just shooting/damage/reload proven working — so the path
      # says what is HONESTLY there right now rather than committing to a
      # name the real game may or may not keep.
      #
      # To refresh the vendored copy (macOS):
      #   cd games/games/predestiny && PD_BASE=/range/ npx vite build
      #   rm -rf ../../../games-alphazone/public/range
      #   cp -r dist ../../../games-alphazone/public/range
      #
      # No hand .htaccess step needed — it is tracked at
      # predestiny/public/.htaccess, so Vite copies it into dist and cp -r
      # carries it across, the same arrangement THE LONG STEP uses.
      #
      # THIS STEP LISTS ITS FILES BY NAME and does not walk the folder: a
      # NEW file under public/range/ has to be added here too or it silently
      # never ships.
      # ---------------------------------------------------------------- #
      - name: Upload the range
        run: |
          if [ ! -f dist/range/index.html ]; then
            echo "::error::dist/range/index.html missing — is public/range/ committed?"
            exit 1
          fi
          if [ ! -f dist/range/.htaccess ]; then
            echo "::error::dist/range/.htaccess missing — it should ride out of predestiny/public/"
            exit 1
          fi
          upload() {
            FILE="$1"; NAME="$2"; TARGET="$3"
            LOCAL_SIZE=$(wc -c < "$FILE")
            base64 -w 0 "$FILE" > /tmp/rg_enc.txt
            RESP=$(curl -sf "https://games.alphazone.com.au/_deploy-relay.php" \
              -d "key=${{ secrets.GAMES_RELAY_KEY }}&name=${NAME}&target=${TARGET}&mode=w" \
              --data-urlencode "data@/tmp/rg_enc.txt")
            echo "  ${TARGET}/${NAME}: $RESP (local: $LOCAL_SIZE bytes)"
            REMOTE_SIZE=$(echo "$RESP" | sed -n 's/^ok:\([0-9]*\)$/\1/p')
            if [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
              echo "::error::${NAME} upload size mismatch (local $LOCAL_SIZE, remote $REMOTE_SIZE)"
              exit 1
            fi
          }
          for f in dist/range/assets/*; do
            upload "$f" "$(basename "$f")" "range/assets"
          done
          upload dist/range/index.html index.html range
          upload dist/range/.htaccess .htaccess range

      # ---------------------------------------------------------------- #
      # THE FIFTH 3D GAME, served at /tsitp/. Built from
      # ClaudeSessions/games/games/tsitp and vendored into public/tsitp,
      # exactly as the other four are — the games site never builds these,
      # it carries them.
      #
      # THE PATH IS NEUTRAL AND THE NAME IS NOT, a fifth time: the folder
      # (tsitp) is permanent per the game's own session, the display name
      # lives only in Home.jsx. It is a 3D walkable Cousins Beach built from
      # real lidar/OSM/canopy data — nothing to play yet beyond walking and
      # flying around.
      #
      # Unlike the other four games, this one has no assets/.htaccess pair —
      # instead it has a world/ folder of binary terrain data (height.bin,
      # surface.bin, plants.bin, ground.png, features.json) fetched relative
      # to index.html at runtime, so it must be walked and uploaded the same
      # way assets/ is. No .htaccess — single static page, no client routing.
      #
      # To refresh the vendored copy (macOS):
      #   cd games/games/tsitp && TS_BASE=/tsitp/ npm run build -w @az/tsitp
      #   rm -rf ../../../games-alphazone/public/tsitp
      #   cp -r dist ../../../games-alphazone/public/tsitp
      #
      # THIS STEP LISTS index.html BY NAME and WALKS assets/ and world/: a
      # NEW top-level folder under public/tsitp/ (not assets/ or world/) has
      # to be added here too or it silently never ships.
      # ---------------------------------------------------------------- #
      - name: Upload Cousins Beach
        run: |
          if [ ! -f dist/tsitp/index.html ]; then
            echo "::error::dist/tsitp/index.html missing — is public/tsitp/ committed?"
            exit 1
          fi
          upload() {
            FILE="$1"; NAME="$2"; TARGET="$3"
            LOCAL_SIZE=$(wc -c < "$FILE")
            base64 -w 0 "$FILE" > /tmp/ts_enc.txt
            RESP=$(curl -sf "https://games.alphazone.com.au/_deploy-relay.php" \
              -d "key=${{ secrets.GAMES_RELAY_KEY }}&name=${NAME}&target=${TARGET}&mode=w" \
              --data-urlencode "data@/tmp/ts_enc.txt")
            echo "  ${TARGET}/${NAME}: $RESP (local: $LOCAL_SIZE bytes)"
            REMOTE_SIZE=$(echo "$RESP" | sed -n 's/^ok:\([0-9]*\)$/\1/p')
            if [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
              echo "::error::${NAME} upload size mismatch (local $LOCAL_SIZE, remote $REMOTE_SIZE)"
              exit 1
            fi
          }
          for f in dist/tsitp/assets/*; do
            upload "$f" "$(basename "$f")" "tsitp/assets"
          done
          for f in dist/tsitp/world/*; do
            upload "$f" "$(basename "$f")" "tsitp/world"
          done
          upload dist/tsitp/index.html index.html tsitp

      # ---------------------------------------------------------------- #
      # THE SIXTH GAME, served at /kitchen/. Built from
      # ClaudeSessions/games/games/kitchen and vendored into public/kitchen,
      # exactly as the other five are — the games site never builds these,
      # it carries them.
      #
      # THE PATH IS NEUTRAL AND THE NAME IS NOT, a sixth time: the folder
      # (kitchen) is permanent per the game's own session, the display name
      # ("Wiparat's Worldwide Kitchen") lives only in Home.jsx. A phone-first
      # cooking game.
      #
      # To refresh the vendored copy (macOS):
      #   cd games/games/kitchen && KT_BASE=/kitchen/ npm run build -w @az/kitchen
      #   rm -rf ../../../games-alphazone/public/kitchen
      #   cp -r dist ../../../games-alphazone/public/kitchen
      #
      # No .htaccess in this build (single static page, no client routing).
      #
      # THIS STEP LISTS ITS FILES BY NAME and does not walk the folder for
      # index.html: a NEW top-level folder under public/kitchen/ (not
      # assets/) has to be added here too or it silently never ships.
      # ---------------------------------------------------------------- #
      - name: Upload Wiparat's Worldwide Kitchen
        run: |
          if [ ! -f dist/kitchen/index.html ]; then
            echo "::error::dist/kitchen/index.html missing — is public/kitchen/ committed?"
            exit 1
          fi
          upload() {
            FILE="$1"; NAME="$2"; TARGET="$3"
            LOCAL_SIZE=$(wc -c < "$FILE")
            base64 -w 0 "$FILE" > /tmp/kt_enc.txt
            RESP=$(curl -sf "https://games.alphazone.com.au/_deploy-relay.php" \
              -d "key=${{ secrets.GAMES_RELAY_KEY }}&name=${NAME}&target=${TARGET}&mode=w" \
              --data-urlencode "data@/tmp/kt_enc.txt")
            echo "  ${TARGET}/${NAME}: $RESP (local: $LOCAL_SIZE bytes)"
            REMOTE_SIZE=$(echo "$RESP" | sed -n 's/^ok:\([0-9]*\)$/\1/p')
            if [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
              echo "::error::${NAME} upload size mismatch (local $LOCAL_SIZE, remote $REMOTE_SIZE)"
              exit 1
            fi
          }
          for f in dist/kitchen/assets/*; do
            upload "$f" "$(basename "$f")" "kitchen/assets"
          done
          upload dist/kitchen/index.html index.html kitchen

      # ---------------------------------------------------------------- #
      # THE SEVENTH GAME, served at /verse/. Built from
      # ClaudeSessions/games/games/firefly and vendored into public/verse,
      # exactly as the other six are — the games site never builds these,
      # it carries them.
      #
      # THE PATH IS NEUTRAL AND THE NAME IS NOT, a seventh time: the folder
      # (verse) is permanent per the game's own session, the display name
      # ("Firefly") lives only in Home.jsx. Serenity at true size, every
      # deck walkable, greybox.
      #
      # To refresh the vendored copy (macOS):
      #   cd games/games/firefly && FF_BASE=/verse/ npx vite build
      #   rm -rf ../../../games-alphazone/public/verse
      #   cp -r dist ../../../games-alphazone/public/verse
      #
      # No .htaccess in this build (single static page, no client routing).
      #
      # THIS STEP LISTS ITS FILES BY NAME and does not walk the folder for
      # index.html: a NEW top-level folder under public/verse/ (not
      # assets/) has to be added here too or it silently never ships.
      # ---------------------------------------------------------------- #
      - name: Upload Firefly
        run: |
          if [ ! -f dist/verse/index.html ]; then
            echo "::error::dist/verse/index.html missing — is public/verse/ committed?"
            exit 1
          fi
          upload() {
            FILE="$1"; NAME="$2"; TARGET="$3"
            LOCAL_SIZE=$(wc -c < "$FILE")
            base64 -w 0 "$FILE" > /tmp/vs_enc.txt
            RESP=$(curl -sf "https://games.alphazone.com.au/_deploy-relay.php" \
              -d "key=${{ secrets.GAMES_RELAY_KEY }}&name=${NAME}&target=${TARGET}&mode=w" \
              --data-urlencode "data@/tmp/vs_enc.txt")
            echo "  ${TARGET}/${NAME}: $RESP (local: $LOCAL_SIZE bytes)"
            REMOTE_SIZE=$(echo "$RESP" | sed -n 's/^ok:\([0-9]*\)$/\1/p')
            if [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
              echo "::error::${NAME} upload size mismatch (local $LOCAL_SIZE, remote $REMOTE_SIZE)"
              exit 1
            fi
          }
          for f in dist/verse/assets/*; do
            upload "$f" "$(basename "$f")" "verse/assets"
          done
          upload dist/verse/index.html index.html verse

      # ---------------------------------------------------------------- #
      # THE SHARED KOKORO VOICE MODEL (Ben's go 2026-10-02, via Pre-Destiny
      # MASTER): one copy for every game at /shared/kokoro/, so a player
      # downloads it once. It is 92 MB, so a file goes up in 2 MB parts, the
      # first mode=w and the rest mode=a (probe run 36942283625: append and
      # 2 MB parts proven). It is WALKED, not listed by name, and a file
      # already live at its local size is skipped, so this only uploads when
      # the tree changes. A CHANGE OF CONTENT MUST COME UNDER A NEW PATH,
      # never overwrite in place: same size means skipped.
      #
      # continue-on-error so it can never block a game's upload. If there is
      # no dist/shared/kokoro yet it exits 0.
      # ---------------------------------------------------------------- #
      - name: Upload the shared Kokoro voice model
        continue-on-error: true
        run: |
          R=https://games.alphazone.com.au/_deploy-relay.php
          K='${{ secrets.GAMES_RELAY_KEY }}'
          [ -d dist/shared/kokoro ] || { echo "no dist/shared/kokoro: nothing to upload"; exit 0; }
          cd dist
          find shared/kokoro -type f | sort | while read -r f; do
            LOCAL=$(wc -c < "$f" | tr -d ' ')
            LIVE=$(curl -sfI "https://games.alphazone.com.au/$f" | tr -d '\r' | awk 'tolower($1)=="content-length:" {print $2}' | tail -1 || true)
            if [ "$LIVE" = "$LOCAL" ]; then echo "  $f: live at $LOCAL bytes, skipped"; continue; fi
            DIR=$(dirname "$f"); NAME=$(basename "$f")
            rm -f /tmp/kc_*; split -b 2097152 -d -a 4 "$f" /tmp/kc_
            MODE=w; LAST=""
            for c in /tmp/kc_*; do
              base64 -w 0 "$c" > /tmp/kc.b64
              LAST=$(curl -sf "$R" -d "key=$K&name=$NAME&target=$DIR&mode=$MODE" --data-urlencode "data@/tmp/kc.b64") || { LAST=""; break; }
              MODE=a
            done
            GOT=$(echo "$LAST" | sed -n 's/^ok:\([0-9]*\)$/\1/p')
            if [ "$GOT" = "$LOCAL" ]; then echo "  $f: uploaded $LOCAL bytes"; else echo "::warning::$f size mismatch (local $LOCAL, server $GOT)"; fi
          done

      # Remove retired games via the relay's rmdir (proven against fireash/).
      # Safe to leave in permanently, it's a no-op once a folder is gone.
      #
      # greenhollow/ joined the list on 2026-09-06 (Ben: "yeah delete the
      # greenhollow files too"). THE NAME MOVED, THE GAME DID NOT: the game
      # now CALLED Green Hollow on the home page is the one that shipped as
      # Burger Barn, and it still lives at /burgerbarn/ — Ben kept the folder
      # ("Burgerbarn can stay same folder name, just change text"). What this
      # removes is the ORIGINAL Green Hollow, the Year 7 to 12 school game
      # from alphazone2026/lifesim, whose vendored build left this repo in the
      # same commit. The rmdir is what takes it off the SERVER: the relay only
      # ever UPLOADS, so deleting public/greenhollow alone would have left the
      # old files answering at /greenhollow/ forever. The
      # cPanel UAPI fileop fallbacks that used to sit here were deleted with
      # the move to the permanent relay: they had been failing silently for
      # months ("could not find the function fileop") and the cPanel API is
      # now behind the host's anti-bot wall anyway.
      - name: Remove retired games
        continue-on-error: true
        run: |
          for DIR in fireash greenhollow; do
            echo "rmdir $DIR: $(curl -sf "https://games.alphazone.com.au/_deploy-relay.php" \
              -d "key=${{ secrets.GAMES_RELAY_KEY }}&op=rmdir&target=$DIR")"
          done

      - name: Done
        run: echo "Done — deployed to games.alphazone.com.au"
