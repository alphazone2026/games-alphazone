name: Build & Deploy to games.alphazone.com.au

on:
  push:
    branches: [master]
    paths-ignore:
      - 'dist/**'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: deploy-games-alphazone
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Write .env
        run: |
          cat > .env << EOF
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL=${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          EOF

      - run: npm ci
      - run: npm run build

      # Upload relay script via cPanel (base64-encoded to avoid quoting issues)
      - name: Upload relay
        run: |
          cat > /tmp/relay.php << 'PHPEOF'
          <?php
          if (($_POST['key'] ?? '') !== 'games-deploy-2026') { http_response_code(403); exit; }

          function relay_sanitized_dir($target) {
            // Arbitrary relative subpath (e.g. "fireash/assets/mapdata") for
            // games with their own static asset trees outside dist/assets -
            // sanitised to stay under __DIR__, no traversal.
            $rel = trim(str_replace('\\', '/', $target), '/');
            $rel = preg_replace('#\.\.+#', '', $rel);
            return __DIR__ . '/' . $rel . '/';
          }

          if (($_POST['op'] ?? '') === 'rmdir') {
            $dir = rtrim(relay_sanitized_dir($_POST['target'] ?? ''), '/');
            if ($dir === rtrim(__DIR__, '/') || $dir === '') { http_response_code(400); echo 'refused'; exit; }
            function relay_rrmdir($d) {
              if (!is_dir($d)) return;
              foreach (scandir($d) as $item) {
                if ($item === '.' || $item === '..') continue;
                $p = $d . '/' . $item;
                is_dir($p) ? relay_rrmdir($p) : unlink($p);
              }
              rmdir($d);
            }
            relay_rrmdir($dir);
            echo 'ok:removed';
            exit;
          }

          $name   = basename($_POST['name'] ?? '');
          $target = $_POST['target'] ?? 'assets';
          $mode   = $_POST['mode']   ?? 'w';
          if (!$name) { http_response_code(400); exit; }
          if ($target === 'assets') { $dir = __DIR__ . '/assets/'; }
          elseif ($target === 'root') { $dir = __DIR__ . '/'; }
          else { $dir = relay_sanitized_dir($target); }
          if (!is_dir($dir)) mkdir($dir, 0755, true);
          file_put_contents($dir . $name, base64_decode($_POST['data']), $mode === 'a' ? FILE_APPEND : 0);
          echo 'ok:' . filesize($dir . $name);
          PHPEOF
          B64=$(base64 -w 0 /tmp/relay.php)
          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" "${{ secrets.GAMES_CPANEL_URL }}/execute/Fileman/save_file_content" \
            -u "${{ secrets.GAMES_CPANEL_USER }}:${{ secrets.GAMES_CPANEL_PASS }}" \
            --data-urlencode "dir=/home/hre8m7ym/games.alphazone.com.au" \
            --data-urlencode "file=_relay.php" \
            --data-urlencode "content@/tmp/relay.php" 2>/tmp/curl_err.txt)
          echo "HTTP status: $HTTP_CODE"
          echo "Response body:"
          cat /tmp/resp.txt
          echo "Curl stderr:"
          cat /tmp/curl_err.txt
          grep -q '"status":1' /tmp/resp.txt || { echo "::error::relay upload failed"; exit 1; }

      # Upload every file under dist/assets/ (JS/CSS bundles) in one POST each
      # — chunked appends previously corrupted a bundle when two deploy runs
      # overlapped, so this uploads whole-file and verifies the byte count
      # the server reports back matches the local file exactly.
      - name: Upload assets
        run: |
          for f in dist/assets/*; do
            NAME=$(basename "$f")
            LOCAL_SIZE=$(wc -c < "$f")
            base64 -w 0 "$f" > /tmp/enc.txt
            RESP=$(curl -sf "https://games.alphazone.com.au/_relay.php" \
              -d "key=games-deploy-2026&name=${NAME}&target=assets&mode=w" \
              --data-urlencode "data@/tmp/enc.txt")
            echo "$NAME: $RESP (local: $LOCAL_SIZE bytes)"
            REMOTE_SIZE=$(echo "$RESP" | sed -n 's/^ok:\([0-9]*\)$/\1/p')
            if [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
              echo "::error::$NAME upload size mismatch (local $LOCAL_SIZE, remote $REMOTE_SIZE)"
              exit 1
            fi
          done

      # Upload index.html
      - name: Upload index.html
        run: |
          LOCAL_SIZE=$(wc -c < dist/index.html)
          base64 -w 0 dist/index.html > /tmp/htmlb64.txt
          RESP=$(curl -sf "https://games.alphazone.com.au/_relay.php" \
            -d "key=games-deploy-2026&name=index.html&target=root&mode=w" \
            --data-urlencode "data@/tmp/htmlb64.txt")
          echo "index.html: $RESP (local: $LOCAL_SIZE bytes)"
          REMOTE_SIZE=$(echo "$RESP" | sed -n 's/^ok:\([0-9]*\)$/\1/p')
          if [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
            echo "::error::index.html upload size mismatch (local $LOCAL_SIZE, remote $REMOTE_SIZE)"
            exit 1
          fi

      # ---------------------------------------------------------------- #
      # Green Hollow — a separate Vite app (alphazone2026/lifesim), served
      # from /greenhollow/ rather than being a route in this one.
      #
      # Its build is VENDORED into public/greenhollow/, which Vite copies
      # verbatim into dist/. Building it here instead would be tidier, but
      # that repo is private and this workflow's GITHUB_TOKEN only covers
      # this one — so a checkout fails with "repository not found". To move
      # to a CI build later: add a PAT with read access to lifesim as a
      # secret, and restore an actions/checkout step using it.
      #
      # To refresh the vendored copy:
      #   cd lifesim && LIFESIM_BASE=/greenhollow/ npm run build
      #   rm -rf ../games-alphazone/public/greenhollow
      #   cp -r dist ../games-alphazone/public/greenhollow
      # ---------------------------------------------------------------- #
      - name: Upload Green Hollow
        run: |
          if [ ! -f dist/greenhollow/index.html ]; then
            echo "::error::dist/greenhollow/index.html missing — is public/greenhollow/ committed?"
            exit 1
          fi
          upload() {
            FILE="$1"; NAME="$2"; TARGET="$3"
            LOCAL_SIZE=$(wc -c < "$FILE")
            base64 -w 0 "$FILE" > /tmp/gh_enc.txt
            RESP=$(curl -sf "https://games.alphazone.com.au/_relay.php" \
              -d "key=games-deploy-2026&name=${NAME}&target=${TARGET}&mode=w" \
              --data-urlencode "data@/tmp/gh_enc.txt")
            echo "  ${TARGET}/${NAME}: $RESP (local: $LOCAL_SIZE bytes)"
            REMOTE_SIZE=$(echo "$RESP" | sed -n 's/^ok:\([0-9]*\)$/\1/p')
            if [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
              echo "::error::${NAME} upload size mismatch (local $LOCAL_SIZE, remote $REMOTE_SIZE)"
              exit 1
            fi
          }
          for f in dist/greenhollow/assets/*; do
            upload "$f" "$(basename "$f")" "greenhollow/assets"
          done
          upload dist/greenhollow/index.html index.html greenhollow

      # ---------------------------------------------------------------- #
      # Burger Barn — same vendoring arrangement as Green Hollow, from the
      # private alphazone2026/burgerbarn repo, served at /burgerbarn/.
      # To refresh the vendored copy (BUILD FROM POWERSHELL, not Git Bash —
      # MSYS2 rewrites the base path):
      #   cd burgerbarn; $env:BARN_BASE = '/burgerbarn/'; npm run build
      #   rm -rf ../games-alphazone/public/burgerbarn
      #   cp -r dist ../games-alphazone/public/burgerbarn
      # ---------------------------------------------------------------- #
      - name: Upload Burger Barn
        run: |
          if [ ! -f dist/burgerbarn/index.html ]; then
            echo "::error::dist/burgerbarn/index.html missing — is public/burgerbarn/ committed?"
            exit 1
          fi
          upload() {
            FILE="$1"; NAME="$2"; TARGET="$3"
            LOCAL_SIZE=$(wc -c < "$FILE")
            base64 -w 0 "$FILE" > /tmp/bb_enc.txt
            RESP=$(curl -sf "https://games.alphazone.com.au/_relay.php" \
              -d "key=games-deploy-2026&name=${NAME}&target=${TARGET}&mode=w" \
              --data-urlencode "data@/tmp/bb_enc.txt")
            echo "  ${TARGET}/${NAME}: $RESP (local: $LOCAL_SIZE bytes)"
            REMOTE_SIZE=$(echo "$RESP" | sed -n 's/^ok:\([0-9]*\)$/\1/p')
            if [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
              echo "::error::${NAME} upload size mismatch (local $LOCAL_SIZE, remote $REMOTE_SIZE)"
              exit 1
            fi
          }
          for f in dist/burgerbarn/assets/*; do
            upload "$f" "$(basename "$f")" "burgerbarn/assets"
          done
          upload dist/burgerbarn/index.html index.html burgerbarn

      # Remove retired games via the relay (the cPanel UAPI Fileman::fileop
      # call below has been failing silently for a while - "could not find
      # the function fileop" - so it's kept only as a harmless fallback;
      # the relay's own rmdir op actually works, proven against fireash/).
      # Safe to leave in permanently, it's a no-op once a folder is gone.
      - name: Remove retired games
        continue-on-error: true
        run: |
          curl -sf "https://games.alphazone.com.au/_relay.php" \
            -d "key=games-deploy-2026&op=rmdir&target=fireash"
          curl -sf "${{ secrets.GAMES_CPANEL_URL }}/execute/Fileman/fileop" \
            -u "${{ secrets.GAMES_CPANEL_USER }}:${{ secrets.GAMES_CPANEL_PASS }}" \
            --data-urlencode "op=unlink" \
            --data-urlencode "sourcefiles=/home/hre8m7ym/games.alphazone.com.au/ash-journey" || true
          curl -sf "${{ secrets.GAMES_CPANEL_URL }}/execute/Fileman/fileop" \
            -u "${{ secrets.GAMES_CPANEL_USER }}:${{ secrets.GAMES_CPANEL_PASS }}" \
            --data-urlencode "op=unlink" \
            --data-urlencode "sourcefiles=/home/hre8m7ym/games.alphazone.com.au/digimon-adventure" || true

      # Neutralise relay
      - name: Neutralise relay
        run: |
          curl -sf "${{ secrets.GAMES_CPANEL_URL }}/execute/Fileman/save_file_content" \
            -u "${{ secrets.GAMES_CPANEL_USER }}:${{ secrets.GAMES_CPANEL_PASS }}" \
            -d "dir=%2Fhome%2Fhre8m7ym%2Fgames.alphazone.com.au&file=_relay.php&content=%3C%3Fphp+%2F%2F+disabled"
          echo "Done — deployed to games.alphazone.com.au"
