name: Build & Deploy to games.alphazone.com.au

on:
  push:
    branches: [master]
    paths-ignore:
      - 'dist/**'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: deploy-games-alphazone
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Write .env
        run: |
          cat > .env << EOF
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL=${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          EOF

      - run: npm ci
      - run: npm run build

      # The relay is PERMANENT now (2026-08-26). It used to be uploaded via
      # the cPanel API before every run and neutralised after — then the host
      # put an anti-bot wall in front of the cPanel API origin and both calls
      # started failing (challenge page, then 401s) while the site domain
      # stayed clean. The relay lives at the docroot permanently, keyed by the
      # GAMES_RELAY_KEY secret (48 hex chars, not the old literal), placed by
      # hand via File Manager. Rotate by editing the file + the secret.
      - name: Check relay
        run: |
          RESP=$(curl -sf "https://games.alphazone.com.au/_deploy-relay.php")
          if [ "$RESP" != "relay-ok" ]; then
            echo "::error::permanent relay not answering (got: $RESP) — re-place _deploy-relay.php via File Manager"
            exit 1
          fi

      # Upload every file under dist/assets/ (JS/CSS bundles) in one POST each
      # — chunked appends previously corrupted a bundle when two deploy runs
      # overlapped, so this uploads whole-file and verifies the byte count
      # the server reports back matches the local file exactly.
      - name: Upload assets
        run: |
          for f in dist/assets/*; do
            NAME=$(basename "$f")
            LOCAL_SIZE=$(wc -c < "$f")
            base64 -w 0 "$f" > /tmp/enc.txt
            RESP=$(curl -sf "https://games.alphazone.com.au/_deploy-relay.php" \
              -d "key=${{ secrets.GAMES_RELAY_KEY }}&name=${NAME}&target=assets&mode=w" \
              --data-urlencode "data@/tmp/enc.txt")
            echo "$NAME: $RESP (local: $LOCAL_SIZE bytes)"
            REMOTE_SIZE=$(echo "$RESP" | sed -n 's/^ok:\([0-9]*\)$/\1/p')
            if [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
              echo "::error::$NAME upload size mismatch (local $LOCAL_SIZE, remote $REMOTE_SIZE)"
              exit 1
            fi
          done

      # Upload index.html
      - name: Upload index.html
        run: |
          LOCAL_SIZE=$(wc -c < dist/index.html)
          base64 -w 0 dist/index.html > /tmp/htmlb64.txt
          RESP=$(curl -sf "https://games.alphazone.com.au/_deploy-relay.php" \
            -d "key=${{ secrets.GAMES_RELAY_KEY }}&name=index.html&target=root&mode=w" \
            --data-urlencode "data@/tmp/htmlb64.txt")
          echo "index.html: $RESP (local: $LOCAL_SIZE bytes)"
          REMOTE_SIZE=$(echo "$RESP" | sed -n 's/^ok:\([0-9]*\)$/\1/p')
          if [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
            echo "::error::index.html upload size mismatch (local $LOCAL_SIZE, remote $REMOTE_SIZE)"
            exit 1
          fi

      # ---------------------------------------------------------------- #
      # THE GAME, vendored from the private alphazone2026/burgerbarn repo and
      # served at /burgerbarn/. It is called GREEN HOLLOW on the home page
      # now (2026-09-06) and the folder deliberately did not follow the name:
      # Ben, "Burgerbarn can stay same folder name, just change text". The
      # original Green Hollow's own upload step used to sit ABOVE this one and
      # left with its build in the same commit.
      # To refresh the vendored copy (macOS — the PowerShell note this comment
      # used to carry was for the old PC; MSYS2 is not in the way here):
      #   cd burgerbarn && BARN_BASE=/burgerbarn/ node node_modules/vite/bin/vite.js build
      #   rm -rf ../games-alphazone/public/burgerbarn
      #   cp -r dist ../games-alphazone/public/burgerbarn
      # ---------------------------------------------------------------- #
      - name: Upload Burger Barn
        run: |
          if [ ! -f dist/burgerbarn/index.html ]; then
            echo "::error::dist/burgerbarn/index.html missing — is public/burgerbarn/ committed?"
            exit 1
          fi
          upload() {
            FILE="$1"; NAME="$2"; TARGET="$3"
            LOCAL_SIZE=$(wc -c < "$FILE")
            base64 -w 0 "$FILE" > /tmp/bb_enc.txt
            RESP=$(curl -sf "https://games.alphazone.com.au/_deploy-relay.php" \
              -d "key=${{ secrets.GAMES_RELAY_KEY }}&name=${NAME}&target=${TARGET}&mode=w" \
              --data-urlencode "data@/tmp/bb_enc.txt")
            echo "  ${TARGET}/${NAME}: $RESP (local: $LOCAL_SIZE bytes)"
            REMOTE_SIZE=$(echo "$RESP" | sed -n 's/^ok:\([0-9]*\)$/\1/p')
            if [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
              echo "::error::${NAME} upload size mismatch (local $LOCAL_SIZE, remote $REMOTE_SIZE)"
              exit 1
            fi
          }
          for f in dist/burgerbarn/assets/*; do
            upload "$f" "$(basename "$f")" "burgerbarn/assets"
          done
          upload dist/burgerbarn/index.html index.html burgerbarn

      # Remove retired games via the relay's rmdir (proven against fireash/).
      # Safe to leave in permanently, it's a no-op once a folder is gone.
      #
      # greenhollow/ joined the list on 2026-09-06 (Ben: "yeah delete the
      # greenhollow files too"). THE NAME MOVED, THE GAME DID NOT: the game
      # now CALLED Green Hollow on the home page is the one that shipped as
      # Burger Barn, and it still lives at /burgerbarn/ — Ben kept the folder
      # ("Burgerbarn can stay same folder name, just change text"). What this
      # removes is the ORIGINAL Green Hollow, the Year 7 to 12 school game
      # from alphazone2026/lifesim, whose vendored build left this repo in the
      # same commit. The rmdir is what takes it off the SERVER: the relay only
      # ever UPLOADS, so deleting public/greenhollow alone would have left the
      # old files answering at /greenhollow/ forever. The
      # cPanel UAPI fileop fallbacks that used to sit here were deleted with
      # the move to the permanent relay: they had been failing silently for
      # months ("could not find the function fileop") and the cPanel API is
      # now behind the host's anti-bot wall anyway.
      - name: Remove retired games
        continue-on-error: true
        run: |
          for DIR in fireash greenhollow; do
            echo "rmdir $DIR: $(curl -sf "https://games.alphazone.com.au/_deploy-relay.php" \
              -d "key=${{ secrets.GAMES_RELAY_KEY }}&op=rmdir&target=$DIR")"
          done

      - name: Done
        run: echo "Done — deployed to games.alphazone.com.au"
