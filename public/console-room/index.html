<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console Room</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #scene { display: block; width: 100vw; height: 100vh; }

  /* ---------------------------------------------------------------------
     THE BOOT CARD — inline, because anything that needs the bundle is too
     late to be a loading screen.

     MEASURED on the live site, 12 September 2026, cold: the bundle is
     downloaded and parsed by 208 ms and the DOM is ready at 842 ms, and then
     FIRST PAINT IS AT 5,672 ms. Between them sit four and a half seconds of a
     black page with nothing on it, while the room is built, four procedural
     texture sets are generated and the bake runs.

     That is not a cosmetic gap. It is very probably part of what Ben reported
     as "pressing start didnt do anything": you click a page that looks loaded,
     nothing happens because nothing is listening yet, and the title card turns
     up afterwards. It is also simply a bad first five seconds.

     So this is HTML and CSS only, in the document, with no script and no font
     to fetch: it paints in the first frame the browser draws and the page is
     never blank. `main.js` removes it the moment the title card goes up, which
     is also the moment START starts working — so the card being gone IS the
     signal that a click will do something. Nothing else may remove it.
     --------------------------------------------------------------------- */
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: #000;
    font: 200 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #e8e6df; letter-spacing: .34em; text-indent: .34em;
  }
  #boot b { font-weight: 200; font-size: clamp(22px, 4.4vw, 44px); letter-spacing: .30em; text-indent: .30em; }
  #boot i { font-style: normal; margin-top: 22px; font-size: 10px; opacity: .45; letter-spacing: .26em; }
  /* A slow breath rather than a spinner. There is no progress to report — the
     build is synchronous and cannot yield one — so a bar that filled at a made
     up rate would be a lie, and a spinner that never moves reads as a hang. */
  #boot u { display: block; width: 116px; height: 1px; margin-top: 26px;
            background: #e8e6df; opacity: .22; animation: breathe 1.9s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .10; transform: scaleX(.35) } 50% { opacity: .40; transform: scaleX(1) } }
  @media (prefers-reduced-motion: reduce) { #boot u { animation: none; opacity: .28 } }
</style>
  <script type="module" crossorigin src="/console-room/assets/index-DtRTpp5U.js"></script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="boot"><b>DOCTOR WHO</b><i>STARTING THE SHIP</i><u></u></div>
</body>
</html>
