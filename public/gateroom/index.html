<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stargate — Marrowfield</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0c0d; overflow: hidden; }
  #view { display: block; width: 100vw; height: 100vh; touch-action: none; }

  /* THE CROSSHAIR IS THE AIM. `Walker._updateTarget` computes what you are
     pointing at from the committed camera, so the dot has to be dead centre and
     it has to be the ONLY thing claiming to be centre — an offset of a few
     pixels is a prompt that lights when the thing is not under the mark, which
     reads as the game being fiddly rather than as the dot being wrong. */
  #cross {
    position: fixed; left: 50%; top: 50%; width: 5px; height: 5px;
    margin: -2.5px 0 0 -2.5px; border-radius: 50%;
    background: rgba(226,234,240,.78);
    box-shadow: 0 0 0 1px rgba(0,0,0,.55);
    pointer-events: none;
  }

  /* The hint fades on the first drag. A dark room with no instruction reads as
     a broken page rather than as a dark room. */
  #hint {
    position: fixed; left: 50%; bottom: 5vh; transform: translateX(-50%);
    font: 400 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: #c9cfd4; letter-spacing: .09em; text-transform: uppercase;
    background: rgba(8,9,10,.55); padding: 8px 16px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.10); pointer-events: none;
    transition: opacity .5s ease; text-align: center;
  }
  #hint.gone { opacity: 0; }

  /* THE OBJECTIVE LOG. Top left, out of the crosshair's way, and quiet enough
     that it never competes with the room for attention. */
  #log {
    position: fixed; left: 22px; top: 20px; max-width: 340px;
    font: 400 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: #cfd6db; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }
  #log .t { font-weight: 600; letter-spacing: .10em; text-transform: uppercase; color: #e8eef2; margin-bottom: 6px; }
  #log .b { color: #9aa4ab; margin-bottom: 2px; }
  #log .o { margin-top: 10px; }
  #log .o div { padding-left: 14px; position: relative; margin-bottom: 3px; }
  #log .o div::before { content: '—'; position: absolute; left: 0; color: #7d868d; }
  #log .o div.done { color: #7d868d; text-decoration: line-through; }
  /* THE PROMPT sits just under the crosshair, where the eye already is. It only
     ever names an action that WILL work. */
  #prompt {
    position: fixed; left: 50%; top: calc(50% + 26px); transform: translateX(-50%);
    font: 500 13px/1 ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: #e8eef2; letter-spacing: .07em; opacity: 0; pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,.9); transition: opacity .12s ease; white-space: nowrap;
  }
  #prompt.on { opacity: 1; }
  #prompt::after { content: ' [E]'; color: #8c959c; }

  /* ONE TOAST PER PRESS, and it replaces rather than stacks: a refusal cannot
     fight a press for the slot, because there is only one. */
  #toast {
    position: fixed; left: 50%; bottom: 13vh; transform: translateX(-50%);
    font: 400 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: #e6c98a; background: rgba(8,9,10,.72); padding: 7px 15px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.10); opacity: 0; pointer-events: none;
    transition: opacity .18s ease; text-align: center; max-width: 70vw;
  }
  #toast.on { opacity: 1; }

  #log .p { margin-top: 10px; color: #7d868d; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
</style>
<canvas id="view"></canvas>
<div id="cross"></div>
<div id="prompt"></div>
<div id="toast"></div>
