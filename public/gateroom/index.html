<!doctype html>
<script type="module" crossorigin src="/gateroom/assets/index-Ce7LKKGx.js"></script>

<!--
  STARGATE at /gateroom/: the three home areas, walkable, in greybox.

  Ben, 2026-09-27: "can we upload this to replace the current stargate game",
  and, asked what should go live, "Areas only, old game removed". So this page
  is the SGC, Atlantis and Destiny greyboxes (docs/areas/). Hall Three, the dial
  and the Marrowfield job (src/main.js) are no longer served; their code and
  their harnesses stay in the repo.

  ?area=sgc|atlantis|destiny picks the area. The SGC is home and the default.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stargate</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0c0d; overflow: hidden; }
  #view { display: block; width: 100vw; height: 100vh; touch-action: none; }

  /* The crosshair: dead centre, and it never eats a click. */
  #cross {
    position: fixed; left: 50%; top: 50%; width: 5px; height: 5px;
    margin: -2.5px 0 0 -2.5px; border-radius: 50%;
    background: rgba(226,234,240,.78); box-shadow: 0 0 0 1px rgba(0,0,0,.55);
    pointer-events: none;
  }

  /* The hint fades on the first drag. A dark room with no instruction reads as
     a broken page rather than as a dark room. */
  #hint {
    position: fixed; left: 50%; bottom: 5vh; transform: translateX(-50%);
    font: 400 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: #c9cfd4; letter-spacing: .09em; text-transform: uppercase;
    background: rgba(8,9,10,.55); padding: 8px 16px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.10); pointer-events: none;
    transition: opacity .5s ease; text-align: center;
  }
  #hint.gone { opacity: 0; }

  #tag {
    position: fixed; left: 22px; top: 20px; max-width: 60vw;
    font: 400 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: #cfd6db; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }

  /* The three areas. Plain links with a query, so they work under any base. */
  #areas {
    position: fixed; right: 18px; top: 16px; display: flex; gap: 6px;
    font: 500 12px/1 ui-sans-serif, system-ui, -apple-system, sans-serif;
    letter-spacing: .08em; text-transform: uppercase;
  }
  #areas a {
    color: #cfd6db; text-decoration: none; padding: 8px 12px; border-radius: 999px;
    background: rgba(8,9,10,.55); border: 1px solid rgba(255,255,255,.12);
  }
  #areas a:hover { border-color: rgba(255,255,255,.35); }
  #areas a.on { color: #0b0c0d; background: #cfd6db; border-color: #cfd6db; }
</style>
<canvas id="view"></canvas>
<div id="cross"></div>
<div id="tag"></div>
<nav id="areas">
  <a href="?area=sgc" data-area="sgc">SGC</a>
  <a href="?area=atlantis" data-area="atlantis">Atlantis</a>
  <a href="?area=destiny" data-area="destiny">Destiny</a>
  <a href="?area=atlantis-city" data-area="atlantis-city">Atlantis city</a>
  <a href="?area=destiny-ship" data-area="destiny-ship">Destiny ship</a>
</nav>
<div id="hint">Greybox &middot; Drag to look &middot; W A S D to walk &middot; Shift to run</div>
