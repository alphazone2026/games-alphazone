<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pre-Destiny — test range</title>
<style>
  /* Restyled toward Destiny 2's actual Firing Range HUD — a teal/cyan accent,
     round ability icons, a radar compass, digital-scoreboard readouts. This
     is a colour-and-shape language taken from a screenshot, not traced
     assets: every shape below is CSS or an inline SVG path drawn for this
     file, matching the house rule (no external art) the same way the rest
     of this engine already does. */
  :root {
    --dz-teal: #35d8c2;
    --dz-teal-glow: rgba(53, 216, 194, .55);
    --dz-green: #7be36a;
  }
  html, body { margin: 0; height: 100%; background: #0b0c0d; overflow: hidden; }
  #view { display: block; width: 100vw; height: 100vh; touch-action: none; }

  #cross {
    position: fixed; left: 50%; top: 50%; width: 5px; height: 5px;
    margin: -2.5px 0 0 -2.5px; border-radius: 50%;
    background: rgba(226,234,240,.82);
    box-shadow: 0 0 0 1px rgba(0,0,0,.55);
    pointer-events: none;
  }
  #cross.aiming { width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px; opacity: .6; }

  /* HIT MARKER — the real answer to "did that connect", since a tracer aimed
     dead down the sightline is geometrically foreshortened to a dot. Two
     crossed bars over the crosshair, gold for a kill, white for a hit. */
  #hitmarker {
    position: fixed; left: 50%; top: 50%; width: 22px; height: 22px;
    margin: -11px 0 0 -11px; pointer-events: none; opacity: 0;
  }
  #hitmarker::before, #hitmarker::after {
    content: ''; position: absolute; left: 50%; top: 50%; width: 15px; height: 2.5px;
    margin: -1.25px 0 0 -7.5px; background: #f2f6f8;
    box-shadow: 0 0 3px rgba(0,0,0,.7);
  }
  #hitmarker::before { transform: rotate(45deg); }
  #hitmarker::after { transform: rotate(-45deg); }
  #hitmarker.show { opacity: 1; transition: opacity 0s; }
  #hitmarker.fade { opacity: 0; transition: opacity .18s ease-out; }
  #hitmarker.kill::before, #hitmarker.kill::after { background: #ffcf6b; }

  /* ================================================================= */
  /* BOTTOM-LEFT CLUSTER — Destiny's own corner for all of this: the    */
  /* ability row sits directly above the shield/health bars, not off   */
  /* on its own. Researched against Destiny 2's real PC HUD rather than */
  /* invented — abilities top, shield, then health at the very edge.   */
  /* Health/shield stay static-full: nothing in this range damages the  */
  /* player yet, so this is chrome ahead of the mechanic.               */
  /* ================================================================= */
  #vitals { position: fixed; left: 20px; bottom: 20px; width: 268px; pointer-events: none; }

  #abilities { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 10px; }
  /* BOXES — rounded squares, corrected from an earlier circular pass after
     a closer reference screenshot. */
  .ability {
    position: relative; width: 42px; height: 42px; border-radius: 8px;
    background: #1a2320; border: 1.5px solid rgba(255,255,255,.14);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.5); flex: none;
  }
  .ability .key {
    font: 700 11px/1 ui-monospace, monospace; color: #dfe8ec;
    text-shadow: 0 1px 2px rgba(0,0,0,.9); z-index: 2;
  }
  .ability .cd {
    position: absolute; inset: 0; border-radius: 6px;
    background: conic-gradient(rgba(4,6,8,.90) var(--pct, 0%), transparent 0);
  }
  .ability.ready { border-color: var(--dz-teal); box-shadow: 0 0 0 1px var(--dz-teal-glow) inset, 0 0 9px var(--dz-teal-glow); }
  .ability.ready .key { color: var(--dz-teal); }

  /* SUPER — a filling gold BAR, not an icon. Sits above the three ability
     boxes rather than among them, the way a meter reads differently from a
     cooldown at a glance. */
  #ab-super {
    width: 100%; height: 12px; border-radius: 3px; margin-bottom: 8px;
    background: #1a1712; border: 1px solid rgba(255,255,255,.14);
    position: relative; overflow: hidden;
  }
  #ab-super .fill {
    position: absolute; inset: 0; width: var(--charge, 0%);
    background: linear-gradient(90deg, #b98a2e, #ffd97a);
  }
  #ab-super .key {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    font: 700 9px/1 ui-monospace, monospace; color: #2a2110; z-index: 2;
    text-shadow: none;
  }
  #ab-super.ready {
    border-color: #ffd97a; box-shadow: 0 0 10px rgba(255,217,122,.6);
    animation: superPulse 1.4s ease-in-out infinite;
  }
  @keyframes superPulse {
    0%, 100% { box-shadow: 0 0 8px rgba(255,217,122,.45); }
    50% { box-shadow: 0 0 16px rgba(255,217,122,.85); }
  }

  /* RADAR — top-left, player-centred like a real FPS minimap: the triangle
     at centre is fixed pointing "up" (forward is always up), and everything
     ELSE moves around it as the player turns. Live target dummies show as
     red blips at their true relative bearing, computed each frame from the
     player's position and facing — a real direction, not a decoration. */
  #radar {
    position: fixed; left: 20px; top: 20px; width: 74px; height: 74px;
    border-radius: 50%; background: radial-gradient(circle, #0e1614 0%, #0a100e 78%);
    border: 1.5px solid rgba(53,216,194,.45); box-shadow: 0 0 10px rgba(53,216,194,.18);
    pointer-events: none; overflow: hidden;
  }
  #radar::before {
    content: ''; position: absolute; inset: 10px; border-radius: 50%;
    border: 1px solid rgba(53,216,194,.22);
  }
  #radar-needle {
    position: absolute; left: 50%; top: 50%; width: 0; height: 0;
    margin: -20px 0 0 -6px;
    border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-bottom: 13px solid var(--dz-teal); filter: drop-shadow(0 0 3px var(--dz-teal-glow));
    z-index: 2;
  }
  #radar-blips { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .blip {
    position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%;
    background: #ff4a3c; box-shadow: 0 0 6px rgba(255,74,60,.9);
  }

  #vitals .bar {
    height: 8px; border-radius: 1px; background: rgba(255,255,255,.08);
    overflow: hidden; margin-bottom: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  #vitals .fill { height: 100%; width: 100%; }
  #vitals .shield .fill { background: linear-gradient(90deg, var(--dz-teal), #cffaf1); }
  #vitals .health .fill { height: 100%; width: 100%; background: linear-gradient(90deg, #dfe3e6, #ffffff); margin-bottom: 0; }

  /* ================================================================= */
  /* AMMO — bottom-right, Destiny's own spot for it                     */
  /* ================================================================= */
  /* WEAPON SLOTS — three, scrollable (mouse wheel, same as 1/2/3). The
     equipped one is the wide teal-filled pill; the other two sit dim. */
  #weapon-slots {
    position: fixed; right: 22px; bottom: 118px; display: flex; justify-content: flex-end;
    gap: 5px; pointer-events: auto; cursor: default;
  }
  #weapon-slots .slot {
    width: 10px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.18);
    transition: width .15s ease, background .15s ease;
  }
  #weapon-slots .slot.active { width: 26px; background: var(--dz-teal); box-shadow: 0 0 6px var(--dz-teal-glow); }

  #hud {
    position: fixed; right: 22px; bottom: 26px; text-align: right;
    font: 700 30px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--dz-teal); text-shadow: 0 0 10px var(--dz-teal-glow), 0 2px 5px rgba(0,0,0,.85);
    pointer-events: none; letter-spacing: .02em;
  }
  #hud .reserve { font-size: 15px; font-weight: 600; color: #7fa39c; margin-left: 6px; text-shadow: none; }
  #hud .low { color: #e08a5a; text-shadow: 0 0 10px rgba(224,138,90,.5); }
  #hud .status { font: 600 11px/1.6 ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; color: #e0b25a; text-transform: uppercase; text-shadow: none; }
  #hud .weaponname { font: 600 12px/1.8 ui-sans-serif, system-ui, sans-serif; letter-spacing: .1em; color: #6b8a84; text-transform: uppercase; text-shadow: none; }
  /* Special ammo meter — a global per-kill meter, same as Destiny's own
     (it fills off any kill regardless of what's equipped); a brick drops on
     the next kill once it's full. */
  #specialmeter { width: 120px; height: 4px; margin: 6px 0 0 auto; background: rgba(255,255,255,.10); border-radius: 1px; overflow: hidden; }
  #specialmeter .fill { height: 100%; background: var(--dz-green); }
  #specialmeter.full .fill { background: #a8f79c; animation: specialPulse 0.9s ease-in-out infinite; }
  @keyframes specialPulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

  /* TARGET SCOREBOARDS — restyled after the Firing Range's own digital
     lane readouts above each target: a dark LCD panel per lane, glowing
     monospace digits, tabular so the numbers don't jitter the layout. */
  #targets {
    position: fixed; right: 22px; top: 18px; display: flex; flex-direction: column; gap: 6px;
    pointer-events: none;
  }
  #targets .row {
    display: flex; justify-content: space-between; align-items: center; gap: 14px;
    min-width: 150px; padding: 5px 10px; background: rgba(6,10,9,.72);
    border: 1px solid rgba(53,216,194,.30); border-radius: 3px;
  }
  #targets .row span:first-child {
    font: 600 11px ui-sans-serif, system-ui, sans-serif; letter-spacing: .05em;
    color: #5e8b83; text-transform: uppercase;
  }
  #targets .row span:last-child {
    font: 700 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums;
    color: var(--dz-teal); text-shadow: 0 0 6px var(--dz-teal-glow);
  }
  #targets .down { border-color: rgba(255,255,255,.10); }
  #targets .down span:last-child { color: #565d61; text-shadow: none; }

  #hint {
    position: fixed; left: 50%; top: 6vh; transform: translateX(-50%);
    font: 400 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: #c9cfd4; letter-spacing: .04em; text-transform: uppercase;
    background: rgba(8,9,10,.55); padding: 8px 16px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.10); pointer-events: none;
    transition: opacity .5s ease; text-align: center; max-width: 90vw;
  }
  #hint.gone { opacity: 0; }

  /* ================================================================= */
  /* CHARACTER SCREEN — Escape. A Guardian preview (the new class bodies)*/
  /* plus basic weapon inventory, Destiny's own "character screen" idea */
  /* kept to what this range actually needs: no stats, no mods, just a  */
  /* look and a loadout.                                                */
  /* ================================================================= */
  #menu {
    position: fixed; inset: 0; background: rgba(6,7,8,.86);
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  #menu[hidden] { display: none; }
  #menu-panel {
    width: min(640px, 92vw); background: #14171a; border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px; padding: 24px 28px; box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  #menu-panel h1 {
    margin: 0 0 4px; font: 600 20px/1.2 ui-sans-serif, system-ui, sans-serif; color: #e8eef2;
  }
  #menu-panel .sub { margin: 0 0 18px; font: 400 13px ui-sans-serif, system-ui, sans-serif; color: #7d868d; }
  #menu-body { display: grid; grid-template-columns: 200px 1fr; gap: 24px; }
  #preview-wrap { background: #0c0e10; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,.08); }
  #preview-canvas { display: block; width: 100%; height: 220px; }
  #menu-classes { display: flex; gap: 8px; margin-top: 10px; }
  #menu-classes button {
    flex: 1; padding: 8px 0; font: 600 12px ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .04em; text-transform: uppercase; color: #b7c0c6;
    background: #1e2226; border: 1px solid rgba(255,255,255,.12); border-radius: 5px; cursor: pointer;
  }
  #menu-classes button.active { color: var(--dz-teal); border-color: var(--dz-teal-glow); background: #17302c; }
  #menu-inv-title { font: 600 11px ui-sans-serif, system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #7d868d; margin: 0 0 10px; }
  .inv-slot {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px; margin-bottom: 8px; background: #1c2024; border: 1px solid rgba(255,255,255,.08);
    border-radius: 6px; cursor: pointer; font: 400 14px ui-sans-serif, system-ui, sans-serif; color: #d7dde1;
  }
  .inv-slot:hover { border-color: rgba(255,255,255,.22); }
  .inv-slot.equipped { border-color: var(--dz-teal-glow); background: #14231f; }
  .inv-slot .ammo-tag {
    font: 600 10px ui-sans-serif, system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 3px; color: #17321f; background: #4ec97a;
  }
  .inv-slot .ammo-tag.primary { background: #9db3bd; color: #10171a; }
  #menu-resume {
    margin-top: 18px; width: 100%; padding: 10px 0; font: 600 13px ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .04em; text-transform: uppercase; color: #0a1512; background: var(--dz-teal); border: none;
    border-radius: 6px; cursor: pointer;
  }
</style>
<canvas id="view"></canvas>
<div id="cross"></div>
<div id="hitmarker"></div>
<div id="radar"><div id="radar-blips"></div><div id="radar-needle"></div></div>

<div id="vitals">
  <div id="ab-super"><div class="fill"></div><span class="key">F</span></div>
  <div id="abilities">
    <div class="ability" id="ab-grenade"><span class="key">Q</span><div class="cd"></div></div>
    <div class="ability" id="ab-melee"><span class="key">C</span><div class="cd"></div></div>
    <div class="ability" id="ab-class"><span class="key">V</span><div class="cd"></div></div>
  </div>
  <div class="bar shield"><div class="fill"></div></div>
  <div class="bar health"><div class="fill"></div></div>
</div>

<div id="weapon-slots"></div>
<div id="hud"></div>
<div id="targets"></div>

<div id="hint">Click lock &middot; WASD move &middot; Space jump/double-jump &middot; click fire (hold for auto) &middot; right-click aim &middot; R reload &middot; 1/2/3 switch weapon &middot; Q grenade &middot; C melee &middot; V ward &middot; F super &middot; Esc character screen</div>

<div id="menu" hidden>
  <div id="menu-panel">
    <h1>Guardian</h1>
    <p class="sub">Character and loadout — Esc to resume</p>
    <div id="menu-body">
      <div>
        <div id="preview-wrap"><canvas id="preview-canvas"></canvas></div>
        <div id="menu-classes">
          <button data-garment="titanPlate">Titan</button>
          <button data-garment="hunterCloak">Hunter</button>
          <button data-garment="warlockRobe">Warlock</button>
        </div>
      </div>
      <div>
        <p id="menu-inv-title">Weapons</p>
        <div id="menu-inventory"></div>
      </div>
    </div>
    <button id="menu-resume">Resume</button>
  </div>
</div>
