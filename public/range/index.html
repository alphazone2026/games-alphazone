<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pre-Destiny — test range</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0c0d; overflow: hidden; }
  #view { display: block; width: 100vw; height: 100vh; touch-action: none; }

  #cross {
    position: fixed; left: 50%; top: 50%; width: 5px; height: 5px;
    margin: -2.5px 0 0 -2.5px; border-radius: 50%;
    background: rgba(226,234,240,.82);
    box-shadow: 0 0 0 1px rgba(0,0,0,.55);
    pointer-events: none;
  }
  #cross.aiming { width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px; opacity: .6; }

  /* ============================================================= */
  /* HEALTH / SHIELD — top-left, Destiny's own layout. Static-full  */
  /* for now: nothing in this range damages the player yet, so it   */
  /* is HUD chrome ahead of the mechanic rather than a working bar. */
  /* ============================================================= */
  #vitals {
    position: fixed; left: 18px; top: 18px; width: 230px;
    pointer-events: none;
  }
  #vitals .bar {
    height: 7px; border-radius: 1px; background: rgba(255,255,255,.10);
    overflow: hidden; margin-bottom: 5px;
    box-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  #vitals .fill { height: 100%; width: 100%; }
  #vitals .shield .fill { background: linear-gradient(90deg, #4fb8e8, #bdeeff); }
  #vitals .health .fill { background: linear-gradient(90deg, #d9dde0, #ffffff); }
  #vitals .label {
    font: 600 10px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .12em;
    text-transform: uppercase; color: #8fa2ac; margin: 0 0 3px 1px;
    text-shadow: 0 1px 2px rgba(0,0,0,.8);
  }

  /* ============================================================= */
  /* AMMO — bottom-right, Destiny's own spot for it                 */
  /* ============================================================= */
  #hud {
    position: fixed; right: 22px; bottom: 26px; text-align: right;
    font: 700 26px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #e8eef2; text-shadow: 0 2px 5px rgba(0,0,0,.85);
    pointer-events: none;
  }
  #hud .reserve { font-size: 14px; font-weight: 600; color: #97a3aa; margin-left: 6px; }
  #hud .low { color: #e08a5a; }
  #hud .status { font: 600 11px/1.6 ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; color: #e0b25a; text-transform: uppercase; }

  #targets {
    position: fixed; right: 18px; top: 18px; min-width: 150px;
    font: 400 13px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: #cfd6db; text-shadow: 0 1px 3px rgba(0,0,0,.8);
    pointer-events: none;
  }
  #targets .row { display: flex; justify-content: space-between; gap: 12px; }
  #targets .down { color: #7d868d; }

  /* ============================================================= */
  /* ABILITIES — bottom-centre cluster: grenade, melee, class, then */
  /* the Super set slightly apart, the way Destiny separates it.    */
  /* Cooldown is a conic-gradient wipe driven by a --pct variable   */
  /* set from JS each frame — no SVG, no extra draw calls.          */
  /* ============================================================= */
  #abilities {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; align-items: flex-end; gap: 10px; pointer-events: none;
  }
  .ability {
    position: relative; width: 48px; height: 48px; border-radius: 6px;
    background: #2a3138; border: 1px solid rgba(255,255,255,.16);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  .ability .key {
    font: 700 13px/1 ui-monospace, monospace; color: #dfe8ec;
    text-shadow: 0 1px 2px rgba(0,0,0,.9); z-index: 2;
  }
  .ability .cd {
    position: absolute; inset: 0;
    background: conic-gradient(rgba(4,6,8,.90) var(--pct, 0%), transparent 0);
  }
  .ability.ready { border-color: rgba(130,225,255,.85); box-shadow: 0 0 0 1px rgba(130,225,255,.5) inset, 0 0 8px rgba(130,225,255,.35); }
  .ability.ready .key { color: #bdeeff; }

  #ab-super { width: 58px; height: 58px; margin-left: 8px; border-radius: 8px; }
  #ab-super .key { font-size: 11px; letter-spacing: .04em; }
  #ab-super.ready {
    border-color: rgba(255,205,120,.9);
    box-shadow: 0 0 0 1px rgba(255,205,120,.6) inset, 0 0 14px rgba(255,205,120,.55);
    animation: superPulse 1.4s ease-in-out infinite;
  }
  @keyframes superPulse {
    0%, 100% { box-shadow: 0 0 0 1px rgba(255,205,120,.6) inset, 0 0 10px rgba(255,205,120,.4); }
    50% { box-shadow: 0 0 0 1px rgba(255,205,120,.9) inset, 0 0 18px rgba(255,205,120,.7); }
  }

  #hint {
    position: fixed; left: 50%; top: 6vh; transform: translateX(-50%);
    font: 400 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: #c9cfd4; letter-spacing: .06em; text-transform: uppercase;
    background: rgba(8,9,10,.55); padding: 8px 16px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.10); pointer-events: none;
    transition: opacity .5s ease; text-align: center;
  }
  #hint.gone { opacity: 0; }
</style>

<div id="vitals">
  <div class="label">Shield</div>
  <div class="bar shield"><div class="fill"></div></div>
  <div class="label">Health</div>
  <div class="bar health"><div class="fill"></div></div>
</div>

<div id="hud"></div>
<div id="targets"></div>

<div id="abilities">
  <div class="ability" id="ab-grenade"><span class="key">G</span><div class="cd"></div></div>
  <div class="ability" id="ab-melee"><span class="key">F</span><div class="cd"></div></div>
  <div class="ability" id="ab-class"><span class="key">C</span><div class="cd"></div></div>
  <div class="ability" id="ab-super"><span class="key">X</span><div class="cd"></div></div>
</div>
