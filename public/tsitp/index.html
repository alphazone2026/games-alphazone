<script>
  // Gone when main.js has built the world (window.game), and a plain message if
  // it never does: a load that throws must not leave a spinner running forever.
  (() => {
    const el = document.getElementById('loading');
    const done = () => { el.classList.add('done'); setTimeout(() => el.remove(), 500); clearInterval(t); };
    const t = setInterval(() => { if (window.game) done(); }, 120);
    const fail = (e) => {
      if (!el.isConnected || el.classList.contains('done')) return;
      clearInterval(t);
      const msg = String(e?.reason?.message ?? e?.message ?? e?.reason ?? e ?? '');
      el.querySelector('.ld-s').innerHTML = '';
      const box = document.createElement('div');
      box.className = 'ld-e';
      box.textContent = 'The town didn\u2019t load. Reloading the page usually fixes it.';
      const small = document.createElement('small'); small.textContent = msg.slice(0, 200);
      if (msg) box.appendChild(small);
      el.querySelector('.ld').appendChild(box);
    };
    addEventListener('error', fail);
    addEventListener('unhandledrejection', fail);
  })();
</script>
